// Isolated client assertions; no test classes enter normal release archives.
allprojects {
    afterEvaluate {
        sourceSets.main.java.srcDir 'gradle/native-memory/client'
        def runtime=file('build/native-memory-client')
        runtime.mkdirs()
        new File(runtime,'options.txt').text='onboardAccessibility:false\npauseOnLostFocus:false\nmaxFps:30\n'
        minecraft.runs.client {
            workingDirectory runtime
            args '--width','640','--height','360','--username','NativeMemoryTest'
        }
        tasks.matching { it.name=='runClient' }.configureEach {
            maxHeapSize='1536m'
            jvmArgs '-XX:ActiveProcessorCount=4'
        }
    }
}
