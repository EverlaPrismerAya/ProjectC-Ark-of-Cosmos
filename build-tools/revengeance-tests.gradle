gradle.beforeProject { project -> project.layout.buildDirectory.set(new File(project.projectDir,'reference/revengeance/tests')) }
allprojects {
    afterEvaluate {
        sourceSets.main.java.srcDir 'build-tools/revengeance'
        sourceSets.main.resources.srcDir 'build-tools/violence/resources'
        minecraft.runs.create('gameTestServer') {
            property 'forge.enabledGameTestNamespaces','arkofcosmos'
            workingDirectory project.file('reference/revengeance/test-run')
        }
    }
}
