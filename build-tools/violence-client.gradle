gradle.beforeProject { project -> project.layout.buildDirectory.set(new File(project.projectDir,'reference/violence/client')) }
allprojects {
    afterEvaluate {
        def generated=project.file('reference/violence/client-src/net/everla/projectc/arkofcosmos');generated.mkdirs()
        new File(generated,'ViolenceClientTest.java').text=project.file('build-tools/violence/ViolenceClientTest.java').getText('UTF-8')
        sourceSets.main.java.srcDir 'reference/violence/client-src'
        def runtime=project.file('reference/violence/client-run');runtime.mkdirs()
        new File(runtime,'options.txt').text='onboardAccessibility:false\nskipMultiplayerWarning:true\npauseOnLostFocus:false\nguiScale:2\nlang:zh_cn\nmaxFps:30\nrenderDistance:6\nsimulationDistance:5\n'
        def config=new File(runtime,'config');config.mkdirs()
        def bsl=System.getProperty('violence.bsl','false').toBoolean()
        if(System.getProperty('violence.native','false').toBoolean()) {
            configurations.configureEach {
                exclude group:'maven.modrinth',module:'oculus'
                exclude group:'maven.modrinth',module:'embeddium'
            }
        }
        new File(config,'oculus.properties').text='enableShaders='+bsl+'\nshaderPack='+(bsl?'BSL_v8.4.01.2.zip':'')+'\n'
        if(bsl){def packs=new File(runtime,'shaderpacks');packs.mkdirs();new File(packs,'BSL_v8.4.01.2.zip').bytes=project.file('run/shaderpacks/BSL_v8.4.01.2.zip').bytes}
        def control=new File(project.projectDir,'reference/violence/client-'+System.currentTimeMillis());control.mkdirs()
        minecraft.runs.client { workingDirectory runtime;args '--width','960','--height','540','--username','ViolenceHost' }
        tasks.matching { it.name=='runClient' }.configureEach {
            maxHeapSize='1536m'
            jvmArgs '-Dviolence.role=host','-Dviolence.control='+control.absolutePath,'-Dviolence.bsl='+bsl
            doFirst {
                def generator=runConfig.get().getClass().classLoader.loadClass('net.minecraftforge.gradle.common.util.runs.RunConfigGenerator')
                def run=runConfig.get()
                def tokens=generator.configureTokensLazy(project,run,generator.mapModClassesToGradle(project,run),minecraftArtifacts,runtimeClasspathArtifacts)
                def resolved=generator.getArgsStream(run,tokens,false).toList()+additionalClientArgs.get().collect { run.replace(tokens,it) }
                new File(control,'launch.json').text=groovy.json.JsonOutput.toJson([main:mainClass.get(),args:resolved,classpath:classpath.asPath])
            }
        }
    }
}
