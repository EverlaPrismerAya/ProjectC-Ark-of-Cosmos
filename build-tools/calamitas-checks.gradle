// Explicit opt-in development check; no source sets or test classes enter the release JAR.
allprojects {
    afterEvaluate { project ->
        def compiledChecks = layout.buildDirectory.dir('calamitas-minecraft-checks')
        tasks.register('compileCalamitasChecks', JavaCompile) {
            dependsOn tasks.named('compileJava')
            source project.fileTree(new File(project.projectDir, 'build-tools/checks')) { include 'Calamitas*Check.java' }
            classpath = sourceSets.main.runtimeClasspath
            destinationDirectory = compiledChecks
            options.encoding = 'UTF-8'
            options.release = 17
            options.compilerArgs += ['-proc:none']
        }
        tasks.register('checkCalamitasCore', JavaExec) {
            dependsOn tasks.named('compileCalamitasChecks')
            classpath = files(compiledChecks) + sourceSets.main.runtimeClasspath
            mainClass = 'CalamitasArenaCheck'
        }
        tasks.register('checkCalamitasRuntimeSeparation') {
            doLast {
                def optional = configurations.clientRuntimeOnly.files
                assert optional.any { it.name.startsWith('oculus-') }
                assert optional.any { it.name.startsWith('embeddium-') }
                assert sourceSets.main.runtimeClasspath.files.intersect(optional).empty
                def client = tasks.named('runClient').get()
                assert client.classpath.files.containsAll(optional)
                assert client.runtimeClasspathArtifacts.files.containsAll(optional)
                def server = tasks.named('runServer').get()
                assert server.classpath.files.intersect(optional).empty
                assert server.runtimeClasspathArtifacts.files.intersect(optional).empty
                println 'PASS: Oculus/Embeddium are discoverable client JVM mods and absent from shared/server runtime'
            }
        }
    }
}
