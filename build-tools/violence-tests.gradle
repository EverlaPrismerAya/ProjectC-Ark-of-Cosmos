// Opt-in: test subscribers and structures never enter the production source set.
gradle.beforeProject { project -> project.layout.buildDirectory.set(new File(project.projectDir,'reference/violence/tests')) }
allprojects {
    afterEvaluate {
        def generated=project.file('reference/violence/test-src/net/everla/projectc/arkofcosmos')
        generated.mkdirs()
        new File(generated,'ViolenceGameTests.java').text=project.file('build-tools/violence/ViolenceGameTests.java').getText('UTF-8')
        if(project.hasProperty('witchRegression')) {
            new File(generated,'WitchTemporaryTests.java').text=project.file('reference/brimstone-witch/gametest/java/net/everla/projectc/arkofcosmos/WitchTemporaryTests.java.txt').getText('UTF-8')
            // The current boss initializes its encounter on its first natural tick.
            new File(generated,'WitchImprovementTests.java').text=project.file('reference/brimstone-witch/WitchImprovementTests.java.txt').getText('UTF-8').replace('boss.saveWithoutId(tag);','boss.tick();boss.saveWithoutId(tag);').replace('boss.invulnerableTime=0;', 'set(boss,"dynamicReduction",new net.everla.projectc.arkofcosmos.calamity.SupremeCalamitasDynamicReduction());boss.invulnerableTime=0;')
            sourceSets.main.resources.srcDir 'reference/brimstone-witch/gametest/resources'
        } else {
            ['WitchTemporaryTests.java','WitchImprovementTests.java'].each { new File(generated,it).delete() }
        }
        sourceSets.main.java.srcDir 'reference/violence/test-src'
        sourceSets.main.resources.srcDir 'build-tools/violence/resources'
        tasks.named('processResources').configure {
            doLast {
                def tag=new File(destinationDir,'data/arkofcosmos/tags/entity_types/ignore_special_damage.json')
                def data=new groovy.json.JsonSlurper().parse(tag)
                if(!data.values.contains('minecraft:pig'))data.values.add('minecraft:pig')
                tag.text=groovy.json.JsonOutput.toJson(data)
            }
        }
        minecraft.runs.create('gameTestServer') {
            property 'forge.enabledGameTestNamespaces','arkofcosmos'
            workingDirectory project.file('reference/violence/test-run')
        }
    }
}
